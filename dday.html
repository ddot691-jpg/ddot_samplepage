<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>인터넷활용 실습 템플릿</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>이름: 권태영</h1>
        <p class="subtitle">kwon tae young</p>
    </header>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="portfolio.html">Portfolio</a>
        <a href="contact.html">Contact</a>
    </nav>
    <main class="container">
        <section>
            <script>
                let now = new Date();

                let yearStr = prompt("연도를 입력하세요");
                let monthStr = prompt("월을 입력하세요");
                let dayStr = prompt("일을 입력하세요.");

                if ( !yearStr || !monthStr || !dayStr ) {
                    document.write("계산을 취소했습니다.");
                }
                else {
                    let year = parseInt(yearStr);
                    let month = parseInt(monthStr);
                    let day = parseInt(dayStr);

                    let targetDate = new Date(year, month - 1, day);
                    let diffMs = targetDate.getTime() - now.getTime();
                    let diffDay = Math.ceil(diffMs / (1000 * 60 * 60 * 24));

                    if (diffDay == 0) {
                        document.write("D-Day 입니다!");
                    } else if (diffDay > 0) {
                        document.write("D-" + diffDay + "일 남았습니다.");
                    } else {
                        document.write("D+" + Math.abs(diffDay) + "일 지났습니다.");
                    }
                }

            </script>
        </section>
    </main>
    <footer>
        <small>&copy; <span id="year"></span>권태영</small>
    </footer>
    <script src="script.js"></script>
</body>

</html>
