<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>D-Day 계산기</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>이름: 권태영</h1>
        <p class="subtitle">kwon tae young</p>
    </header>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="portfolio.html">Portfolio</a>
        <a href="contact.html">Contact</a>
    </nav>
    <main class="container">
        <section>
            <h2 style="text-align: center;">D-Day 계산기</h2>
            <hr>
            <script>
                let now = new Date();

                let yearStr = prompt("연도를 입력하세요", "2025");
                let monthStr = prompt("월을 입력하세요", "12");
                let dayStr = prompt("일을 입력하세요.", "25");

                if (!yearStr || !monthStr || !dayStr) {
                    document.write("계산을 취소했습니다.");
                }
                else {
                    let year = parseInt(yearStr);
                    let month = parseInt(monthStr);
                    let day = parseInt(dayStr);

                    let targetDate = new Date(year, month - 1, day);
                    let diffMs = targetDate.getTime() - now.getTime();
                    let diffDay = Math.ceil(diffMs / (1000 * 60 * 60 * 24));

                    document.write("입력한 날짜: ", targetDate.toLocaleDateString(), "<br>");
                    document.write("오늘 날짜: ", now.toLocaleDateString(), "<br><br>");

                    if (diffDay == 0) {
                        document.write("<b>D-Day 입니다!</b>");
                    } else if (diffDay > 0) {
                        document.write("<b>D-" + diffDay + "일 남았습니다.</b>");
                    } else {
                        document.write("<b>D+" + Math.abs(diffDay) + "일 지났습니다.</b>");
                    }
                }
            </script>
            <br>
            <i style="font-size: small; color: #999;">새로고침을 통해 다시 계산할 수 있습니다.</i>
        </section>
    </main>
    <footer>
        <small>&copy; <span id="year"></span>권태영</small>
    </footer>
    <script src="script.js"></script>
</body>

</html>
