    <main class="container">
        <section>
            <h2 style="text-align: center;">식사 랜덤 뽑기</h2>
            <hr>
            <script>
                let inputString = prompt("식사 랜덤 뽑기", "짜장면, 짬뽕, 볶음밥");

                if (!inputString) {
                    document.write("뽑기를 취소했습니다.");
                }
                else {
                    let items = inputString.split(',');
                    document.write("입력한 메뉴: ", items, "<br>");
                    let index = Math.floor(Math.random() * items.length);

                    let choice = items[index];
                    choice = choice.trim();

                    document.write("선정된 메뉴: <b>", choice, "</b>");
                }
            </script>
            <i style="font-size: small; color: #999;">새로고침을 통해 새로 뽑을 수 있습니다.</i>
        </section>
    </main>
    <footer>
        <small>&copy; <span id="year"></span>권태영</small>
    </footer>
    <script src="script.js"></script>
</body>
