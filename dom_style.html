<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>스타일 변환기</title>
    <link rel="stylesheet" href="style.css">
    <style>
        section {
            text-align: center;
        }

        #target {
            font-size: 20px;
            font-weight: bold;
            padding: 20px;
            border: 2px solid #ccc;
            margin: 20px auto;
            width: 80%;
            transition: all 0.3s;
        }

        button {
            padding: 10px 15px;
            font-size: 16px;
            margin: 5px;
            cursor: pointer;
            background-color: #eee;
            border: 1px solid #999;
            border-radius: 5px;
            color:rgb(92, 92, 92);
        }

        button:hover {
            background-color: #ddd;
        }
    </style>
    <script>
        const colors = ["red", "yellow", "green", "blue", "purple", "black"];
        let Index = 0;
        function changeColr() {
            var obj = document.getElementById("target");
            obj.style.color = colors[Index];
            Index = (Index + 1) % colors.length;
        }

        function toggleSize() {
            var obj = document.getElementById("target");
            if (obj.style.fontSize == "") {
                obj.style.fontSize = "32px";
            } else {
                obj.style.fontSize = "";
            }
        }

        function toggleBg() {
            var obj = document.getElementById("target");
            if (obj.style.background == "") {
                obj.style.background = "yellow";
            } else {
                obj.style.background = "";
            }
        }

        function toggleVisibility() {
            var obj = document.getElementById("target");
            if (obj.style.display == "none") {
                obj.style.display = "block";
            } else {
                obj.style.display = "none";
            }
        }
    </script>
</head>

<body>
    <header>
        <h1>이름: 권태영</h1>
        <p class="subtitle">kwon tae young</p>
    </header>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="portfolio.html">Portfolio</a>
        <a href="contact.html">Contact</a>
    </nav>
    <main class="container">
        <section>
            <h2>DOM 스타일 제어하기</h2>
            <hr>
            <p id="target">이 문장의 스타일을 바꿔보세요!</p>

            <button onclick="changeColr()">글자색 변경</button>
            <button onclick="toggleSize()">크게 보기</button>
            <button onclick="toggleBg()">배경 강조</button>
            <button onclick="toggleVisibility()">숨기기/보이기</button>
        </section>
    </main>
    <footer>
        <small>&copy; <span id="year"></span>권태영</small>
    </footer>
    <script src="script.js"></script>
</body>

</html>
